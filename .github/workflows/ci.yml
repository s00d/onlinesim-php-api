name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      # No lock file (a library): resolve the newest dev tools for each PHP version.
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  lint:
    name: lint (php-cs-fixer, composer-normalize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/php-cs-fixer check --diff
      - run: composer normalize --dry-run

  # Installs the `git archive` of the tree (what Packagist/Composer ship) into an empty project and runs the
  # README "Testing" example against MockOnlineSim, on the floor and the latest PHP.
  smoke:
    name: smoke from artifact (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: php tests/smoke-artifact.php
